<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Web Project</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Hello from your iPad web project!</h1>
    <p>Tap the buttons below to see JavaScript in action.</p>

    <div class="controls">
      <button id="helloBtn">Say Hello</button>
      <button id="countBtn">Count: <span id="count">0</span></button>
      <button id="themeBtn">Toggle Theme</button>
    </div>

    <section class="notes">
      <h2>Notes</h2>
      <p>This is a tiny static site — it runs entirely in the browser. No server required.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
